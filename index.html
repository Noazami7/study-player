<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="字幕プレイヤー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>字幕プレイヤー</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1d1f; --muted: #66666c; --line: #e3e0d8;
  --accent: #2f6fd6; --cur: #e7effc; --chip: #f0ede5; --btn: #ffffff; --on: #2f6fd6; --on-fg: #ffffff;
  --note-bg: #fff3d1; --note-fg: #5e4300; --unc: #b4690e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --fg: #ececee; --muted: #9d9da5; --line: #2d2d31;
    --accent: #7ea9ff; --cur: #1e2a42; --chip: #232327; --btn: #222225; --on: #3f70d2; --on-fg: #ffffff;
    --note-bg: #3a2f12; --note-fg: #ffd98a; --unc: #f0a64a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, system-ui, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
[lang="ko"] { font-family: -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* 一覧 */
.bar { padding: 14px 16px 6px; }
.bar h1 { margin: 0; font-size: 1.3rem; }
#libraryView main { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }
.steps { margin: 8px 0 14px; padding-left: 1.3em; color: var(--muted); font-size: 14px; line-height: 1.7; }
.btn {
  display: inline-block; padding: 11px 20px; border-radius: 12px; background: var(--on); color: var(--on-fg);
  font-weight: 600; cursor: pointer;
}
#lib { margin: 16px 0 0; padding: 0; list-style: none; }
#lib li { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
#lib .open { flex: 1; text-align: left; padding: 0; border: 0; background: transparent; cursor: pointer; }
#lib .title { display: block; font-size: 1rem; line-height: 1.4; }
#lib .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
#lib .del { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); font-size: 13px; color: var(--muted); }
.note { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--note-bg); color: var(--note-fg); font-size: 13px; line-height: 1.6; }

/* プレイヤー */
#top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
#stage { position: relative; background: #000; aspect-ratio: 16 / 9; }
#v { display: block; width: 100%; height: 100%; background: #000; }
#picker {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 14px; background: #111; color: #f2f2f2; text-align: center; font-size: 14px;
}
#picker p { margin: 0; line-height: 1.5; }
#picker .file { font-size: 12px; color: #a9a9b0; word-break: break-all; }
.pick { display: inline-block; padding: 10px 22px; border-radius: 10px; background: var(--on); color: var(--on-fg); font-weight: 600; cursor: pointer; }
.row { display: flex; gap: 6px; padding: 6px 8px 0; }
.row:last-child { padding-bottom: 6px; }
.row button {
  flex: 1; min-height: 40px; padding: 0 2px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--btn); font-size: 14px; cursor: pointer; touch-action: manipulation;
}
/* 上の段は 7 個並ぶので、等分にせず文字の長さに応じて幅を配る（等分だと狭い画面で「1行ずつ」が「1行ず／つ」と折り返す。
   ボタンの高さは変わらないので、寸法を測っても気づけない） */
.row.sub button { flex: 1 1 auto; min-height: 34px; font-size: 12.5px; white-space: nowrap; }
.row button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: transparent; }
.row button:disabled { opacity: .45; cursor: default; }
/* 縦持ちでは操作ボタンを画面の下端に固定する（親指が届く位置。よく押す 前・もう一度・次 を一番下に）。
   下はホームインジケータの分を空ける。帯の上ではページをスクロールさせない（帯に触れた指では追従を切らない作りなので、
   スクロールさせると次の行で今の行まで引き戻される） */
#ctrl {
  position: fixed; left: 0; right: 0; bottom: 0; touch-action: none;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: var(--bg); border-top: 1px solid var(--line);
}
/* コピーの結果。iOS はクリップボードに書き込んでも何も知らせないので、ページで短く出す */
#toast {
  position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 21;
  padding: 8px 14px; border-radius: 18px; background: var(--fg); color: var(--bg); font-size: 13px;
  white-space: nowrap; pointer-events: none; box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
}
/* 追従が切れて「今の行へ ↓」が右に出ている間は、左に寄せる（中央のままだと「コピーできませんでした」が重なる） */
#follow:not([hidden]) + #toast { left: calc(14px + env(safe-area-inset-left)); transform: none; }
#info { padding: 6px 12px; background: var(--note-bg); color: var(--note-fg); font-size: 13px; line-height: 1.5; }
#info button { margin-left: 8px; padding: 2px 10px; border: 1px solid currentColor; border-radius: 8px; background: transparent; }

#list { max-width: 760px; margin: 0 auto; padding: 0 0 55vh; }
.lead { margin: 0; padding: 10px 14px; font-size: 12px; line-height: 1.6; color: var(--muted); border-bottom: 1px solid var(--line); }
.cue { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); border-left: 4px solid transparent; cursor: pointer; }
.cue.cur { background: var(--cur); border-left-color: var(--accent); }
.meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.t { margin: 2px 0 4px; font-size: 1.25rem; line-height: 1.5; }
.t .unc { text-decoration: underline dotted var(--unc); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.alt { margin: 0 0 4px; font-size: 0.78rem; line-height: 1.4; color: var(--muted); }
.ja { margin: 0 0 6px; font-size: 0.92rem; line-height: 1.5; color: var(--muted); }
.gl { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; padding: 0; list-style: none; }
.gl li { padding: 1px 7px; border-radius: 6px; background: var(--chip); font-size: 0.8rem; line-height: 1.7; }
.gl b { margin-right: 4px; font-weight: 600; }
.gl i { margin-right: 4px; font-size: 0.7rem; font-style: normal; color: var(--muted); }
/* 解説（字幕データの x。付いている行にだけ出る）。1 項目 1 行で、単語の意味より控えめにする */
.ex { margin: 6px 0 0; padding: 1px 0 1px 8px; border-left: 2px solid var(--line); font-size: 0.78rem; line-height: 1.55; color: var(--muted); }
/* 長い項目は折り返すので、続きの段を 1 字下げて項目の頭を見つけやすくする（揃えたままだと、全角の【は字形の左が空いて
   いるので見出しの段のほうが右に寄って見え、項目どうしが 1 つの塊に見える）。下げても折り返しの段の数はほとんど変わらない */
.ex p { margin: 0; padding-left: 1em; text-indent: -1em; }
.ex p + p { margin-top: 2px; }
.cue.cur .ex { border-left-color: var(--accent); }
body.hide-ja .ja, body.hide-gl .gl, body.hide-ex .ex { display: none; }
/* 縦持ちでは下端の帯のすぐ上に出す（帯と重ならない高さ） */
#follow {
  position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(100% + 10px); z-index: 20;
  padding: 10px 16px; border: 0; border-radius: 22px; background: var(--on); color: var(--on-fg);
  font-size: 14px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); cursor: pointer;
}
/* 横持ち: 左に動画と操作、右に字幕。操作ボタンは左の列の一番下に置き、画面の下端の帯にはしない */
@media (orientation: landscape) and (max-height: 600px) {
  #playerView:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
  #top { height: 100vh; height: 100dvh; display: flex; flex-direction: column; border-bottom: 0; border-right: 1px solid var(--line); }
  #stage { flex: 1; min-height: 0; aspect-ratio: auto; }
  #ctrl { position: relative; left: auto; right: auto; bottom: auto; padding: 0 0 env(safe-area-inset-bottom); border-top: 0; }
  #follow { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); }
  #follow:not([hidden]) + #toast { left: 50%; transform: translateX(-50%); }   /* 「今の行へ ↓」は右の列なので重ならない */
  #list { padding-bottom: 70vh; }
}
</style>
</head>
<body>
<div id="libraryView">
  <header class="bar"><h1>字幕プレイヤー</h1></header>
  <main>
    <ol class="steps">
      <li>動画（.mp4）と字幕データ（.json）を「ファイル」アプリの「このiPhone内」に入れておく</li>
      <li>下の「字幕データを追加」で .json を選ぶ（1 本につき最初の 1 回だけ）</li>
      <li>一覧の題名をタップし、「動画を選ぶ」→「ファイルを選択」から .mp4 を選ぶ</li>
    </ol>
    <label class="btn">字幕データを追加<input id="addData" type="file" accept=".json,application/json" multiple hidden></label>
    <p id="homeNote" class="note" hidden>ホーム画面に追加してから、ホーム画面のアイコンで開いてください。圏外でも開けるようになります。Safari で追加した字幕データは、ホーム画面のアプリからは見えません。</p>
    <p id="libNote" class="note" hidden></p>
    <ul id="lib"></ul>
  </main>
</div>

<div id="playerView" hidden>
  <header id="top">
    <div id="stage">
      <video id="v" controls playsinline preload="metadata"></video>
      <div id="picker">
        <p id="pickmsg">動画を選んでください。「ファイルを選択」から選びます（写真ライブラリからは選ばない）。</p>
        <label class="pick">動画を選ぶ<input id="pickVideo" type="file" accept="video/*" hidden></label>
        <p class="file" id="expect"></p>
      </div>
    </div>
    <div id="info" hidden></div>
    <!-- 「一覧」は押すと動画の選択が外れるので、いちばんよく押す 次・もう一度 の上を避けて左端に置く（それでも「◀ 前」の
         真上なので、動画を読み込んでいる時は押すと確かめる）。コピーは押し違えても困らないので右端（次 の上） -->
    <div id="ctrl">
      <button id="follow" type="button" hidden>今の行へ ↓</button>
      <div id="toast" role="status" hidden></div>
      <div class="row sub">
        <button id="back" type="button">一覧</button>
        <button id="step" type="button" aria-pressed="false">1行ずつ</button>
        <button id="speed" type="button">1.0x</button>
        <button id="tja" type="button" aria-pressed="true">日本語</button>
        <button id="tgl" type="button" aria-pressed="true">単語</button>
        <button id="tex" type="button" aria-pressed="true" hidden>解説</button>
        <button id="copy" type="button" disabled>コピー</button>
      </div>
      <div class="row">
        <button id="prev" type="button">◀ 前</button>
        <button id="again" type="button">↻ もう一度</button>
        <button id="next" type="button">次 ▶</button>
      </div>
    </div>
  </header>
  <main id="list"></main>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const x = localStorage.getItem('sp:' + k); return x === null ? d : JSON.parse(x); } catch (_) { return d; } },
    set(k, x) { try { localStorage.setItem('sp:' + k, JSON.stringify(x)); return true; } catch (_) { return false; } },
    del(k) { try { localStorage.removeItem('sp:' + k); } catch (_) { /* 消せなくても困らない */ } },
  };
  const fmt = (t) => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const POS_ABBR = {
    '名詞': '名', '固有名詞': '固', '代名詞': '代', '動詞': '動', '形容詞': '形', '副詞': '副', '句動詞': '句',
    '熟語': '熟', '間投詞': '間', '感動詞': '感', '前置詞': '前', '接続詞': '接', '依存名詞': '依', '数詞': '数',
    '補助用言': '補', '冠形詞': '冠', '接続副詞': '接',
  };
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  // ---------------- 一覧 ----------------
  const libView = $('libraryView'), playerView = $('playerView'), libEl = $('lib'), libNote = $('libNote');
  $('homeNote').hidden = standalone;

  function libIndex() { return store.get('lib', []); }
  function renderLib() {
    libEl.textContent = '';
    for (const item of libIndex()) {
      const li = document.createElement('li');
      const open = document.createElement('button');
      open.type = 'button'; open.className = 'open';
      const title = document.createElement('span'); title.className = 'title'; title.textContent = item.title;
      const sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = fmt(item.duration || 0) + ' ・ ' + item.cues + ' 行' + (item.t ? ' ・ 前回 ' + fmt(item.t) : '');
      open.append(title, sub);
      open.addEventListener('click', () => openPlayer(item.id));
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '削除';
      del.addEventListener('click', () => {
        if (!window.confirm('「' + item.title + '」を一覧から消しますか？（動画ファイルは消えません）')) return;
        store.del('data:' + item.id); store.del('t:' + item.id);
        store.set('lib', libIndex().filter((x) => x.id !== item.id));
        renderLib();
      });
      li.append(open, del);
      libEl.appendChild(li);
    }
  }
  function note(el, text) { el.textContent = text; el.hidden = !text; }

  $('addData').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    const added = [], replaced = [], failed = [];
    for (const f of files) {
      try {
        const data = JSON.parse(await f.text());
        if (data.format !== 'study-player/1' || !Array.isArray(data.cues) || !data.cues.length) throw new Error('形式が違う');
        const id = String(data.id || data.video || f.name);
        if (!store.set('data:' + id, data)) throw new Error('保存できない（容量不足の可能性）');
        // 同じ動画（同じ id）の字幕データは置き換える（解説などを直した版を入れ直す時）。前回位置は動画の時刻なのでそのまま使える
        const old = libIndex().find((x) => x.id === id);
        const lib = libIndex().filter((x) => x.id !== id);
        lib.unshift({ id, title: data.title || f.name, duration: data.duration || 0, cues: data.cues.length, t: old ? old.t : undefined });
        store.set('lib', lib);
        (old ? replaced : added).push(data.title || f.name);
      } catch (err) {
        failed.push(f.name + '（' + err.message + '）');
      }
    }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) { /* 任意 */ }
    note(libNote, (added.length ? added.length + ' 本追加しました。' : '') +
      (replaced.length ? replaced.length + ' 本は同じ動画の字幕データを新しいものに置き換えました。' : '') +
      (failed.length ? '追加できなかったもの: ' + failed.join(' / ') : ''));
    renderLib();
  });

  // ---------------- プレイヤー ----------------
  const v = $('v'), picker = $('picker'), pickmsg = $('pickmsg'), info = $('info'), top = $('top'), followBtn = $('follow'), list = $('list');
  const ctrl = $('ctrl'), copyBtn = $('copy'), texBtn = $('tex'), toast = $('toast');
  const ROLL = 0.25;   // 行の頭から再生する時に少し手前から始める（語頭を切らないため）
  const PAD = 0.25;    // 1行ずつ止める時、字幕の終わりから少し待つ（次の行の頭は越えない）
  const LATE = 0.5;    // 1行ずつ: 止める点をこれ以上過ぎてから気づいた時は、その行では止めない（tick のコメント）
  const SPEEDS = [1, 0.85, 0.7];
  const landscape = window.matchMedia('(orientation: landscape) and (max-height: 600px)');

  let data = null, id = '', cues = [];
  let cur = -1, holdUntil = -1, stoppedAt = -1;
  let stopIdx = 0;     // 1行ずつ: この行の終わりで止める（動画は 0 秒から始まるので、最初は最初の行）
  let seekTo = -1;     // playFrom で飛ばした先。seeking の時刻がこれなら自分のシーク（素早く 2 度押すと
                       // seeking が続けて 2 回届き、どちらも後の飛び先を指す。1 回で消える印だと 2 回目を指の操作と取り違える）
  let moved = false;   // 動画を読み込んでから再生か移動をしたか（していない間は前回位置を覚えない）
  let follow = true, raf = 0, hasVideo = false, picked = false, objectUrl = null, trackUrls = [];
  let step = store.get('step', false), speed = store.get('speed', 1);

  function renderText(el, text, ranges) {
    // ranges: 聞き取りが不確かな文字範囲 [[開始, 終了], ...]（自動の書き起こしの時だけ付く）
    const marks = new Array(text.length).fill(false);
    for (const [a, b] of ranges || []) for (let k = Math.max(0, a); k < Math.min(text.length, b); k++) marks[k] = true;
    let k = 0;
    while (k < text.length) {
      const m = marks[k];
      let j = k;
      while (j < text.length && marks[j] === m && text[j] !== '\n') j++;
      if (j === k) { el.appendChild(document.createElement('br')); k++; continue; }
      const chunk = text.slice(k, j);
      if (m) { const s = document.createElement('span'); s.className = 'unc'; s.textContent = chunk; el.appendChild(s); }
      else el.appendChild(document.createTextNode(chunk));
      k = j;
    }
  }
  function buildList() {
    list.textContent = '';
    if (data.lead) { const p = document.createElement('p'); p.className = 'lead'; p.textContent = data.lead; list.appendChild(p); }
    let withEx = 0;
    cues = data.cues.map((c, k) => {
      const sec = document.createElement('section'); sec.className = 'cue';
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(c.s) + ' ・ ' + (k + 1);
      const t = document.createElement('p'); t.className = 't'; t.lang = data.lang || 'en'; renderText(t, c.t || '', c.u);
      sec.append(meta, t);
      if (c.alt) {
        const alt = document.createElement('p'); alt.className = 'alt'; alt.lang = data.lang || 'en';
        alt.textContent = '別の聞き取り: ' + c.alt;
        sec.appendChild(alt);
      }
      if (c.ja) { const ja = document.createElement('p'); ja.className = 'ja'; ja.lang = 'ja'; renderText(ja, c.ja, null); sec.appendChild(ja); }
      if (c.g && c.g.length) {
        const ul = document.createElement('ul'); ul.className = 'gl';
        for (const [w, pos, mean] of c.g) {
          const li = document.createElement('li');
          const b = document.createElement('b'); b.lang = data.lang || 'en'; b.textContent = w;
          const i = document.createElement('i'); i.title = pos; i.textContent = POS_ABBR[pos] || (pos || '').slice(0, 1);
          li.append(b, i, document.createTextNode(mean));
          ul.appendChild(li);
        }
        sec.appendChild(ul);
      }
      // 解説: 表示順に並んだ文字列の配列。1 項目を 1 段にする
      const ex = (Array.isArray(c.x) ? c.x : []).map((x) => String(x == null ? '' : x).trim()).filter(Boolean);
      if (ex.length) {
        const div = document.createElement('div'); div.className = 'ex'; div.lang = 'ja';
        for (const x of ex) { const p = document.createElement('p'); p.textContent = x; div.appendChild(p); }
        sec.appendChild(div);
        withEx += 1;
      }
      sec.addEventListener('click', () => playFrom(k));
      list.appendChild(sec);
      return { el: sec, s: +c.s, e: +c.e };
    });
    texBtn.hidden = !withEx; // 解説の付いた行が無い字幕データでは「解説」ボタンを出さない
  }

  // 全画面にすると下の字幕欄が見えないので、全画面の間だけ動画側に字幕を出す
  function vttUrl(field) {
    const ts = (x) => {
      const h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), s = (x % 60).toFixed(3).padStart(6, '0');
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + s;
    };
    let out = 'WEBVTT\n\n';
    data.cues.forEach((c, k) => {
      const text = String(c[field] || '').replace(/-->/g, '→').trim();
      if (text) out += (k + 1) + '\n' + ts(+c.s) + ' --> ' + ts(+c.e) + '\n' + text + '\n\n';
    });
    const url = URL.createObjectURL(new Blob([out], { type: 'text/vtt' }));
    trackUrls.push(url);
    return url;
  }
  function setTracks() {
    v.querySelectorAll('track').forEach((t) => t.remove());
    trackUrls.forEach((u) => URL.revokeObjectURL(u)); trackUrls = [];
    const add = (field, lang, label) => {
      const tr = document.createElement('track');
      tr.kind = 'subtitles'; tr.srclang = lang; tr.label = label; tr.src = vttUrl(field);
      v.appendChild(tr);
      tr.track.mode = 'hidden';
    };
    add('t', data.lang || 'en', data.langLabel || '字幕');
    if (data.cues.some((c) => c.ja)) add('ja', 'ja', '日本語');
  }
  function showTracks(on) {
    const tracks = Array.from(v.textTracks || []);
    tracks.forEach((t, k) => { t.mode = on && k === 0 ? 'showing' : 'hidden'; });
  }
  v.addEventListener('webkitbeginfullscreen', () => showTracks(true));
  v.addEventListener('webkitendfullscreen', () => showTracks(false));
  document.addEventListener('fullscreenchange', () => showTracks(document.fullscreenElement === v));

  // 学習中は画面を消さない（対応していない環境では何もしない）
  let wakeLock = null;
  async function keepAwake() {
    try {
      if (!('wakeLock' in navigator) || playerView.hidden || document.visibilityState !== 'visible' || wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) { wakeLock = null; }
  }
  function letSleep() { try { if (wakeLock) wakeLock.release(); } catch (_) { /* 解放済み */ } wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
    else savePos();
  });

  function cueAt(t) {
    let lo = 0, hi = cues.length - 1, ans = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (cues[m].s <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function endPoint(k) {
    const c = cues[k], n = cues[k + 1];
    return n ? Math.max(c.e, Math.min(c.e + PAD, n.s)) : c.e + PAD;
  }
  // 字幕の行が見える範囲: 上は動画（と案内）の下端、下は縦持ちなら下端のボタン帯の上端（横持ちはどちらも列の外なので 0）
  function insetTop() { return landscape.matches ? 0 : top.getBoundingClientRect().height; }
  function insetBottom() { return landscape.matches ? 0 : Math.max(0, window.innerHeight - ctrl.getBoundingClientRect().top); }
  function scrollToCur(force) {
    if (cur < 0) return;
    const r = cues[cur].el.getBoundingClientRect(), inset = insetTop(), avail = window.innerHeight - inset - insetBottom();
    if (!force && r.top >= inset + avail * 0.08 && r.bottom <= inset + avail * 0.7) return;
    // 普段は行の頭を上から 2 割の位置に置く。解説を出した行のように背が高く、それだと下端がボタン帯に
    // 隠れる時だけ、行の終わりまで見える位置まで上へ寄せる（入りきらなければ行の頭を上端に合わせる）
    const off = Math.max(8, Math.min(avail * 0.2, avail - r.height - 8));
    window.scrollTo({ top: Math.max(0, window.scrollY + r.top - inset - off), behavior: force ? 'auto' : 'smooth' });
  }
  function setCur(k) {
    if (k === cur) return;
    if (cur >= 0 && cues[cur]) cues[cur].el.classList.remove('cur');
    cur = k;
    copyBtn.disabled = cur < 0;
    if (cur >= 0) { cues[cur].el.classList.add('cur'); if (follow) scrollToCur(false); }
  }
  // 1行ずつ: 止めた後に次に止める行。前の行の中に収まった短い行（止める点をもう過ぎている）は飛ばす（飛ばさないと、
  // 動画の ▶ で続きを再生した途端にその行で止まり、▶ を 2 回押すことになる。「次」では今までどおりその行へ行く）
  function nextStop(k, t) { while (k < cues.length && endPoint(k) <= t) k += 1; return k; }
  // 色を付ける行。1行ずつの間は止める行より先へ進めない（次の行が今の行の終わりより前に始まると、色が次の行へ
  // 移ってから、止めた時に今の行へ戻ってしまう）
  function rowAt(t) { const c = cueAt(t); return step ? Math.min(c, stopIdx) : c; }
  function tick() {
    const t = v.currentTime;
    // シークの途中は止めない（currentTime は飛び先で、再生が進んだ位置ではない。シークバーで先へ飛んだ直後、
    // seeking が届く前に画面の書き換えが来ると、前の止める行の終わりを越えたと見て止めてしまう）。
    // 止まっている時の tick（pause・seeked から呼ぶ）は止めず、止める点を LATE 以上過ぎていれば止める行を引き直すだけにする
    if (step && !v.seeking && stopIdx >= 0 && stopIdx < cues.length && t >= endPoint(stopIdx) &&
        (!v.paused || t >= endPoint(stopIdx) + LATE)) {
      if (t < endPoint(stopIdx) + LATE) {
        // 止める点は行の頭より後なので、巻き戻しも終わっている（画面の書き換えが止まった後の 1 回の tick で行の頭と
        // 止める点を両方越えた時に、巻き戻しの印を残さない）
        v.pause(); holdUntil = -1; stoppedAt = stopIdx; stopIdx = nextStop(stopIdx + 1, t); setCur(stoppedAt); return;
      }
      // 止める点を大きく過ぎてから気づいた: 動画は進んだまま画面の書き換えだけが止まっていた（全画面・ピクチャインピクチャ
      // など）。古い行で止めて色を何行も前へ戻さず、今の時刻から止める行を引き直す。その間に一時停止した時も同じ
      // （引き直さないと、色は古い止める行で頭打ちになったまま残り、「もう一度」「前」「次」がその行を基準に動く）
      const c = cueAt(t);
      stopIdx = c < 0 ? 0 : (t < endPoint(c) ? c : c + 1);
    }
    if (t >= holdUntil) { holdUntil = -1; setCur(rowAt(t)); }
    if (!v.paused) raf = requestAnimationFrame(tick);
  }
  function playFrom(k) {
    if (!hasVideo || k < 0 || k >= cues.length) return;
    // 行から見始めたら「続きから」などの案内を消す（動画の下で高さを取り、解説を出した背の高い行が下端の帯に隠れる）。
    // 動画の ▶ では消さない（押し違えて頭から見始めても、案内の「続きから」で前回の位置へ戻れるように。消すと、その後の
    // 一時停止か 3 秒の再生で前回位置が上書きされ、戻る手段が無くなる）
    if (!info.hidden) showInfo([]);
    stoppedAt = -1; holdUntil = cues[k].s; stopIdx = k;
    setFollow(true); setCur(k); scrollToCur(true);
    seekTo = Math.max(0, cues[k].s - ROLL);
    // 同じ時刻へのシークがまだ終わっていなければ飛ばし直さない（「もう一度」の素早い 2 度押しなど）。WebKit はシークの途中で
    // 同じ時刻へ飛ばすと何もしないシークとして扱い、seeking（v.seeking は false）と seeked をすぐ出して seeking を解く。
    // 本当のシークが終わる前に印（seekTo）が消え、tick の !v.seeking も効かなくなる
    if (!(v.seeking && Math.abs(v.currentTime - seekTo) < 0.01)) v.currentTime = seekTo;
    v.play().catch(() => {});
    keepAwake();
  }
  const base = () => (v.paused && stoppedAt >= 0 ? stoppedAt : cur);
  function setFollow(on) { follow = on; followBtn.hidden = on; }

  $('prev').onclick = () => playFrom(Math.max(0, base() - 1));
  $('again').onclick = () => playFrom(Math.max(0, base()));
  $('next').onclick = () => playFrom(Math.min(cues.length - 1, base() + 1));
  function applyToggles() {
    $('step').setAttribute('aria-pressed', String(step));
    $('speed').textContent = (speed === 1 ? '1.0' : String(speed)) + 'x';
    v.playbackRate = speed;
    const hideJa = store.get('hideJa', false), hideGl = store.get('hideGl', false), hideEx = store.get('hideEx', false);
    document.body.classList.toggle('hide-ja', hideJa); $('tja').setAttribute('aria-pressed', String(!hideJa));
    document.body.classList.toggle('hide-gl', hideGl); $('tgl').setAttribute('aria-pressed', String(!hideGl));
    document.body.classList.toggle('hide-ex', hideEx); texBtn.setAttribute('aria-pressed', String(!hideEx));
  }
  $('step').onclick = () => {
    step = !step; store.set('step', step);
    // 行の頭へ飛んだ直後（少し手前から再生している間）は、時刻で引くと 1 つ前の行に当たるので、色を付けている行を使う
    const t = v.currentTime, c = holdUntil >= 0 ? cur : cueAt(t);
    stopIdx = c < 0 ? 0 : (t < endPoint(c) ? c : c + 1);
    applyToggles();
  };
  $('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; store.set('speed', speed); applyToggles(); };
  $('tja').onclick = () => { store.set('hideJa', !store.get('hideJa', false)); applyToggles(); };
  $('tgl').onclick = () => { store.set('hideGl', !store.get('hideGl', false)); applyToggles(); };
  // 解説の出し入れは行の高さが大きく変わるので、今の行を見える位置に戻す
  texBtn.onclick = () => { store.set('hideEx', !store.get('hideEx', false)); applyToggles(); if (follow) scrollToCur(true); };
  // 一覧へ戻ると選んだ動画が外れ、iPhone では「ファイルを選択」からたどり直しになる。よく押す「◀ 前」の真上にあって
  // 押し違えやすいので、動画を読み込んでいる時は確かめる。確かめている間はページのスクリプトが止まるが動画は進む
  // （迷っている間に「1行ずつ」の止める点を過ぎる）ので、再生中なら止めてから聞き、キャンセルなら再生に戻す
  // （confirm は同期なので、play() はタップの処理の中に収まる）
  $('back').onclick = () => {
    const playing = hasVideo && !v.paused;
    if (playing) v.pause();
    if (hasVideo && !window.confirm('一覧に戻りますか？（選んだ動画は外れます。前回の位置は残ります）')) {
      if (playing) v.play().catch(() => {});
      return;
    }
    closePlayer();
  };
  followBtn.onclick = () => { setFollow(true); scrollToCur(true); };
  // 向きを変えるとレイアウトが変わる（横持ちは 2 列）ので、追従中なら今の行を見える位置に戻す
  if (landscape.addEventListener) landscape.addEventListener('change', () => { if (follow && !playerView.hidden) scrollToCur(true); });

  // コピー: 今の行の英語と日本語を 2 行で（日本語が無ければ英語だけ。AI に貼って聞く時など）。押した時だけ写し、
  // 再生に合わせては写さない。Clipboard API はクリックの処理の中で呼ぶ（iOS は操作の外からの書き込みを拒む）
  const oneLine = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  function execCopy(text) {
    // Clipboard API が無い・拒まれた時は、隠した textarea を選んでコピーする旧来の方法に落とす
    // （readonly はキーボードを出さないため。iOS は select() だけでは選ばれないことがあるので範囲も指定する）
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    let ok = false;
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    return ok;
  }
  let toastTimer = 0;
  function showToast(text) {
    toast.textContent = text; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 1600);
  }
  copyBtn.onclick = () => {
    if (cur < 0 || !data || !data.cues[cur]) return;
    const c = data.cues[cur], text = [oneLine(c.t), oneLine(c.ja)].filter(Boolean).join('\n');
    if (!text) return;
    let write;
    try {
      write = window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(text).then(() => true, () => execCopy(text))
        : Promise.resolve(execCopy(text));
    } catch (_) { write = Promise.resolve(execCopy(text)); }
    // 失敗した時は、字幕の行を長押しすれば文字を選べる
    write.then((ok) => showToast(ok ? 'コピーしました' : 'コピーできませんでした'));
  };
  const manual = (e) => { if (follow && !playerView.hidden && !(e.target instanceof Node && top.contains(e.target))) setFollow(false); };
  window.addEventListener('touchmove', manual, { passive: true });
  window.addEventListener('wheel', manual, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (playerView.hidden || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); if (v.paused) v.play().catch(() => {}); else v.pause(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
    else if (e.key === 'r') $('again').click();
  });

  v.addEventListener('play', () => { moved = true; stoppedAt = -1; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); keepAwake(); });
  // 止まった時刻の行に色を合わせる（全画面・ピクチャインピクチャなどで画面の書き換えが止まっている間に一時停止すると、
  // tick が回らないまま止まり、色と巻き戻しの印が古いまま残って「もう一度」「前」「次」がずれる）。止まっている tick は
  // 止めない（「1行ずつ」の止める点を LATE 以上過ぎていれば、止める行を引き直す）。「1行ずつ」で止めた後は seeked と同じく動かさない
  v.addEventListener('pause', () => { cancelAnimationFrame(raf); if (v.paused && stoppedAt < 0) tick(); savePos(); });
  v.addEventListener('seeking', () => {
    moved = true;
    if (Math.abs(v.currentTime - seekTo) < 0.01) return;
    seekTo = -1; stoppedAt = -1; holdUntil = -1;
    const t = v.currentTime, c = cueAt(t);
    stopIdx = c < 0 ? 0 : (t < endPoint(c) ? c : c + 1);
    setCur(c);
  });
  v.addEventListener('seeked', () => {
    // 飛び終えたら印を消す（残すと、見終わった後の ▶ やシークバーの左端による 0 秒へのシークを、
    // 最初の行の頭が 0 秒に近い動画で自分のシークと取り違える）。次のシークがもう始まっていれば残す
    if (!v.seeking) seekTo = -1;
    // 止まっている間に飛んだ時は色を合わせる。ただし「1行ずつ」で止めた後は動かさない（シークの完了から seeked が届くまでの
    // 間に画面の書き換えが入ってそこで止めると、遅れて届いた seeked で色だけが止めた行の次へ進み、「次」「もう一度」とずれる）
    if (v.paused && stoppedAt < 0) tick();
  });

  // 前回位置（「続きから」用）。行の頭へ飛んだ直後は少し手前にいるので、行の頭を覚える（手前の時刻だと「続きから」が
  // 1 つ前の行になる）。読み込んでから再生も移動もしていない動画では覚えない（読み込んだ時や外した時の 0 秒で上書きしない）
  function resumePoint() { return Math.max(v.currentTime, holdUntil); }
  let lastSave = 0;
  function savePos() {
    if (!id || !hasVideo || !moved) return;
    lastSave = resumePoint(); store.set('t:' + id, lastSave);
  }
  v.addEventListener('timeupdate', () => { if (Math.abs(resumePoint() - lastSave) >= 3) savePos(); });

  function showInfo(parts) {
    info.textContent = '';
    for (const p of parts) info.appendChild(typeof p === 'string' ? document.createTextNode(p) : p);
    info.hidden = !parts.length;
  }
  v.addEventListener('loadedmetadata', () => {
    if (!picked) return;
    hasVideo = true; picker.hidden = true;
    v.playbackRate = speed;
    const parts = [];
    if (data.duration && Math.abs(v.duration - data.duration) > 1.5) {
      parts.push('選んだ動画の長さ（' + fmt(v.duration) + '）が字幕データ（' + fmt(data.duration) + '）と合いません。別の動画かもしれません。');
    }
    const t0 = store.get('t:' + id, 0);
    if (t0 > 5 && t0 < v.duration - 5) {
      if (parts.length) parts.push(document.createElement('br'));
      parts.push('前回は ' + fmt(t0) + ' まで見ました。');
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '続きから';
      b.onclick = () => { playFrom(Math.max(0, cueAt(t0))); showInfo([]); };
      parts.push(b);
    }
    showInfo(parts);
  });
  v.addEventListener('error', () => {
    if (!picked) return;
    hasVideo = false; picker.hidden = false;
    pickmsg.textContent = 'この動画は再生できませんでした。別のファイルを選んでください。';
  });
  function clearVideo() {
    hasVideo = false; picked = false;
    // 次の動画はシークなしで 0 秒から始まるので、外した動画の行の状態を最初に戻す
    stopIdx = 0; stoppedAt = -1; holdUntil = -1; seekTo = -1; moved = false;
    v.pause();
    try { v.srcObject = null; } catch (_) { /* 未対応 */ }
    v.removeAttribute('src');
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    v.load();
  }
  $('pickVideo').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    clearVideo();
    picked = true; pickmsg.textContent = '読み込んでいます…';
    // Safari は File をそのまま渡せる（大きい動画で blob URL より安定）。渡せないブラウザは blob URL にする
    let direct = false;
    if ('srcObject' in v) { try { v.srcObject = f; direct = true; } catch (_) { direct = false; } }
    if (!direct) { objectUrl = URL.createObjectURL(f); v.src = objectUrl; }
    keepAwake();
  });

  function openPlayer(itemId) {
    const d = store.get('data:' + itemId, null);
    if (!d) { note(libNote, '字幕データが見つかりません。もう一度「字幕データを追加」で読み込んでください。'); return; }
    data = d; id = itemId;
    cur = -1; holdUntil = -1; stopIdx = 0; stoppedAt = -1; seekTo = -1; setFollow(true);
    copyBtn.disabled = true;
    buildList(); setTracks(); applyToggles(); showInfo([]);
    $('expect').textContent = data.video ? '探すファイル: ' + data.video : '';
    pickmsg.textContent = '動画を選んでください。「ファイルを選択」から選びます（写真ライブラリからは選ばない）。';
    picker.hidden = false;
    libView.hidden = true; playerView.hidden = false;
    window.scrollTo(0, 0);
    keepAwake();
  }
  function closePlayer() {
    savePos();
    const lib = libIndex().map((x) => (x.id === id ? Object.assign({}, x, { t: store.get('t:' + id, 0) }) : x));
    store.set('lib', lib);
    clearVideo(); letSleep();
    clearTimeout(toastTimer); toast.hidden = true;
    data = null; id = ''; cues = []; list.textContent = '';
    playerView.hidden = true; libView.hidden = false;
    renderLib();
  }

  applyToggles();
  renderLib();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* file:// 等では使えない */ });
})();
</script>
</body>
</html>
